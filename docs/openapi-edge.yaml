          type: string
          format: date-time
        contentDigest:
          $ref: '#/components/schemas/Digest'
        changed:
          type: boolean
        deploymentId:
          type:
          - string
          - 'null'
          format: uuid
        payloadArtifactObjectId:
          type:
          - string
          - 'null'
          format: uuid
