      - scope
      - observedAt
      - contentDigest
      - changed
      properties:
        observationId:
          type: string
          format: uuid
        collectorId:
          type: string
          minLength: 1
          maxLength: 300
        serviceKey:
          $ref: '#/components/schemas/ServiceKey'
        scope:
          $ref: '#/components/schemas/EstateScope'
