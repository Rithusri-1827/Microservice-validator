openapi: 3.1.0
info:
  title: Microservices Validator Edge API
  version: 0.2.0
  summary: Normative API used by CLI, CI/CD, policy pipelines, deployment hooks, and optional collectors.
  description: This contract is the authenticated machine-to-machine boundary for Edge and delivery tooling. It
    covers central policy synchronization, controlled artifact transfer, CI validation publication, service/scope
    onboarding, authoritative deployment decisions, deployment evidence, and the separately gated runtime-observation
    extension. Rio browser workflows are defined in the UI API contract.
x-msval-boundary: edge
servers:
- url: https://governance.example.internal
  description: Deployment-specific governance-plane endpoint
tags:
- name: Policies
- name: Validation runs
- name: Declarations
- name: Decisions
- name: Deployments
- name: Services
- name: Observations
security:
- bearerAuth: []
paths:
  /v1/policy-resolutions:
    get:
      tags:
      - Policies
      operationId: resolveActivePolicy
      summary: Resolve the policy artifact active for a service, gate, and estate scope.
      parameters:
      - name: serviceKey
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/ServiceKey'
      - name: gate
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/Gate'
      - name: environment
        in: query
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 64
      - name: cluster
        in: query
        schema:
          type: string
          maxLength: 128
      - name: region
        in: query
        schema:
          type: string
          maxLength: 64
      - name: tenant
        in: query
        schema:
          type: string
          maxLength: 128
      responses:
        '200':
          description: Active policy resolution.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyResolution'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/policy-artifacts/{digest}/content:
    get:
      tags:
      - Policies
      operationId: downloadPolicyArtifact
      summary: Download an immutable policy artifact by digest.
      parameters:
      - $ref: '#/components/parameters/DigestPath'
      - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: Immutable policy artifact.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Digest:
              schema:
                $ref: '#/components/schemas/Digest'
            X-Policy-Signature:
              description: Base64-encoded detached signature when artifact signing is enabled.
              schema:
                type: string
          content:
            application/vnd.msval.policy+gzip:
              schema:
                type: string
                format: binary
        '304':
          description: The caller already holds these immutable artifact bytes.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Digest:
              schema:
                $ref: '#/components/schemas/Digest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/artifact-uploads:
    post:
      tags:
      - Policies
      operationId: initiateArtifactUpload
      summary: Initiate a controlled upload for policy, evidence, manifest, or observation content.
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArtifactUploadRequest'
      responses:
        '201':
          description: Upload slot created with a short-lived destination.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtifactUploadSlot'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/artifact-uploads/{artifactObjectId}/complete:
    post:
      tags:
      - Policies
      operationId: completeArtifactUpload
      summary: Verify the uploaded object's digest and make it available for registration.
      parameters:
      - $ref: '#/components/parameters/ArtifactObjectIdPath'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArtifactUploadCompletion'
      responses:
        '200':
          description: Upload verified and finalized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtifactObject'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/policy-artifacts:
    post:
      tags:
      - Policies
      operationId: registerPolicyArtifact
      summary: Register a tested immutable policy artifact built by the protected policy pipeline.
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PolicyArtifactRegistration'
      responses:
        '201':
          description: Artifact registered.
          headers:
            Location:
              $ref: '#/components/headers/Location'
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyArtifact'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/policy-activations:
    post:
      tags:
      - Policies
      operationId: activatePolicyArtifact
      summary: Activate or roll back to an immutable policy artifact for a gate and scope.
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PolicyActivationRequest'
      responses:
        '201':
          description: Activation created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyActivation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/validation-runs:
    post:
      tags:
      - Validation runs
      operationId: publishValidationRun
      summary: Publish an authenticated CI validation run and its complete rule-result set.
      description: 'Only an accepted complete run can reconcile central CI-stage findings. A stale policy

        activation is retained as evidence but cannot satisfy an enforced gate or mutate active findings.

        '
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidationRunSubmission'
      responses:
        '201':
          description: Validation run accepted and findings reconciled.
          headers:
            Location:
              $ref: '#/components/headers/Location'
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationRunReceipt'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: The policy activation changed. The retained run is returned as `STALE_POLICY`. Idempotency
            conflicts use `ProblemDetails` from the generic conflict response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationRunReceipt'
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          description: Retained run was produced by an untrusted evaluator or rejected after semantic validation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationRunReceipt'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/validation-runs/{validationRunId}:
    get:
      tags:
      - Validation runs
      operationId: getValidationRun
      parameters:
      - $ref: '#/components/parameters/ValidationRunIdPath'
      responses:
        '200':
          description: Validation run with results and linked finding identifiers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationRun'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/estate-scopes:
    get:
      tags:
      - Services
      operationId: listEstateScopes
      parameters:
      - name: active
        in: query
        schema:
          type: boolean
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Cursor-paginated estate scopes visible to the caller.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EstateScopePage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
      - Services
      operationId: createEstateScope
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EstateScopeRegistration'
      responses:
        '201':
          description: Estate scope created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EstateScopeResource'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/estate-scopes/{scopeId}:
    get:
      tags:
      - Services
      operationId: getEstateScope
      parameters:
      - $ref: '#/components/parameters/ScopeIdPath'
      responses:
        '200':
          description: Estate scope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EstateScopeResource'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
      - Services
      operationId: updateEstateScopeLifecycle
      parameters:
      - $ref: '#/components/parameters/ScopeIdPath'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LifecycleUpdate'
      responses:
        '200':
          description: Estate scope lifecycle updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EstateScopeResource'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/services/{serviceKey}:
    get:
      tags:
      - Services
      operationId: getService
      parameters:
      - $ref: '#/components/parameters/ServiceKeyPath'
      responses:
        '200':
          description: Registered service and repository binding.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceResource'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags:
      - Services
      operationId: registerOrUpdateService
      summary: Administrator-managed onboarding and repository-to-service identity binding.
      parameters:
      - $ref: '#/components/parameters/ServiceKeyPath'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceRegistration'
      responses:
        '200':
          description: Existing service registration updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceResource'
        '201':
          description: Service registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceResource'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/services/{serviceKey}/lifecycle:
    patch:
      tags:
      - Services
      operationId: updateServiceLifecycle
      parameters:
      - $ref: '#/components/parameters/ServiceKeyPath'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LifecycleUpdate'
      responses:
        '200':
          description: Service lifecycle updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceResource'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/declarations/{serviceKey}:
    put:
      tags:
      - Declarations
      operationId: publishArchitectureDeclaration
      summary: Publish the architecture declaration accepted from a protected repository ref.
      parameters:
      - $ref: '#/components/parameters/ServiceKeyPath'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArchitectureDeclarationPublication'
      responses:
        '200':
          description: Existing declaration digest already current.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArchitectureDeclaration'
        '201':
          description: Declaration version published.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArchitectureDeclaration'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/decisions:
    post:
      tags:
      - Decisions
      operationId: createDecision
      summary: Request an authoritative estate-contextual decision.
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DecisionRequest'
      responses:
        '201':
          description: Immutable decision created.
          headers:
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Decision'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Required CI validation evidence is missing, stale, incomplete, or mismatched.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/decisions/{decisionId}:
    get:
      tags:
      - Decisions
      operationId: getDecision
      parameters:
      - $ref: '#/components/parameters/DecisionIdPath'
      responses:
        '200':
          description: Immutable decision and rule results.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Decision'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/deployment-events:
    post:
      tags:
      - Deployments
      operationId: publishDeploymentEvent
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeploymentEventSubmission'
      responses:
        '202':
          description: Deployment evidence accepted idempotently.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeploymentEventReceipt'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/observations:
    post:
      tags:
      - Observations
      operationId: publishObservation
      summary: MVP 5 read-only collector endpoint.
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ObservationSubmission'
      responses:
        '202':
          description: Observation accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObservationReceipt'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 128
        pattern: ^[A-Za-z0-9._:-]+$
    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      schema:
        type: string
        maxLength: 160
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
        maxLength: 512
    PageSize:
      name: pageSize
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    DigestPath:
      name: digest
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Digest'
    ArtifactObjectIdPath:
      name: artifactObjectId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ScopeIdPath:
      name: scopeId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ServiceKeyPath:
      name: serviceKey
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ServiceKey'
    ValidationRunIdPath:
      name: validationRunId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DecisionIdPath:
      name: decisionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  headers:
    CorrelationId:
      description: End-to-end request correlation identifier.
      schema:
        type: string
        format: uuid
    ETag:
      description: Strong content validator for the immutable policy digest.
      schema:
        type: string
    Location:
      description: URI of the created resource.
      schema:
        type: string
        format: uri-reference
  responses:
    BadRequest:
      description: Request syntax or semantic validation failed.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Unauthorized:
      description: Authentication is missing or invalid.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Forbidden:
      description: The authenticated subject is not authorized for this operation or scope.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    NotFound:
      description: Resource was not found or is not visible to the caller.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Conflict:
      description: State, version, digest, or idempotency conflict.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    ServiceUnavailable:
      description: An authoritative dependency is unavailable; callers must not treat this as an allow.
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 1
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
  schemas:
    ServiceKey:
      type: string
      minLength: 3
      maxLength: 200
      pattern: ^[a-z0-9][a-z0-9._/-]*[a-z0-9]$
    Digest:
      type: string
      pattern: ^sha256:[a-f0-9]{64}$
    Gate:
      type: string
      enum:
      - DESIGN
      - PR
      - PRE_DEPLOY
      - ADMISSION
      - RUNTIME
    Severity:
      type: string
      enum:
      - INFO
      - LOW
      - MEDIUM
      - HIGH
      - CRITICAL
    RuleOutcome:
      type: string
      enum:
      - PASS
      - WARN
      - FAIL
      - ERROR
      - SKIP
    Verdict:
      type: string
      enum:
      - PASS
      - WARN
      - FAIL
    DecisionVerdict:
      type: string
      enum:
      - ALLOW
      - DENY
      - ADVISORY
      - UNDECIDABLE
    EstateScope:
      type: object
      required:
      - environment
      properties:
        environment:
          type: string
          minLength: 1
          maxLength: 64
        cluster:
          type:
          - string
          - 'null'
          maxLength: 128
        region:
          type:
          - string
          - 'null'
          maxLength: 64
        tenant:
          type:
          - string
          - 'null'
          maxLength: 128
    EstateScopeRegistration:
      allOf:
      - $ref: '#/components/schemas/EstateScope'
      - type: object
        required:
        - displayName
        properties:
          displayName:
            type: string
            minLength: 1
            maxLength: 200
    EstateScopeResource:
      allOf:
      - $ref: '#/components/schemas/EstateScopeRegistration'
      - type: object
        required:
        - scopeId
        - active
        - createdAt
        properties:
          scopeId:
            type: string
            format: uuid
          active:
            type: boolean
          createdAt:
            type: string
            format: date-time
          deactivatedAt:
            type:
            - string
            - 'null'
            format: date-time
    EstateScopePage:
      type: object
      additionalProperties: false
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/EstateScopeResource'
        nextCursor:
          type:
          - string
          - 'null'
    LifecycleUpdate:
      type: object
      additionalProperties: false
      required:
      - active
      - reason
      properties:
        active:
          type: boolean
        reason:
          type: string
          minLength: 3
          maxLength: 2000
    RepositoryIdentity:
      type: object
      additionalProperties: false
      required:
      - provider
      - organization
      - repository
      properties:
        provider:
          type: string
          enum:
          - GITHUB
          - GITLAB
          - AZURE_DEVOPS
          - BITBUCKET
          - OTHER
        organization:
          type: string
          minLength: 1
          maxLength: 200
        repository:
          type: string
          minLength: 1
          maxLength: 200
        url:
          type:
          - string
          - 'null'
          format: uri
    ServiceRegistration:
      type: object
      required:
      - displayName
      - ownerKey
      - repository
      - allowedScopeIds
